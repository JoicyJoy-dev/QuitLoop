# Server / EC2. Postgres stays on the Docker network only.
# API is bound to loopback for Nginx: proxy_pass http://127.0.0.1:8080
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  postgres:
    ports: !reset []
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports: !override
      - "127.0.0.1:8080:8080"
